name: 构建星海牧场 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'galaxy/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件（platform-34 + build-tools）
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "downloading cmdline-tools ..."
            curl -sL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            unzip -q -o /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: 同步网页资源到 assets
        run: |
          mkdir -p android/app/src/main/assets
          rsync -a --delete --exclude='*.bat' galaxy/ android/app/src/main/assets/

      - name: 安装 Gradle 8.5
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: 编译
        run: |
          gradle -p android assembleRelease assembleDebug --no-daemon

      - name: 列出产物
        run: find android/app/build/outputs/apk -name '*.apk'

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 星海牧场-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
